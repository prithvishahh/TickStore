[package]
name = "tickstore"
version = "0.1.0"
edition = "2021"
description = "Columnar on-disk storage engine for financial market tick data"
license = "MIT"
readme = "README.md"
rust-version = "1.85"

[[bin]]
name = "tickstore"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
